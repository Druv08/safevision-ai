name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install OpenCV system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install dependencies
        run: pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: ruff check .
      # Tests mock Supabase and the YOLO models: no keys or weights needed.
      - name: Test
        run: pytest -q
      # Shared SafeVision engine rules (synthetic model outputs). The live-camera
      # parity test needs local weights and a clip, so it skips itself here.
      - name: Test AI engine
        run: pytest -q ../ai-model/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
